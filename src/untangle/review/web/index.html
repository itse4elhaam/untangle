<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untangle Review</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/review.css">
<script>
  try { const t = localStorage.getItem('ur-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="bar" id="bar">
  <a class="brand" href="/" aria-label="All reviews"><img src="/static/mark.svg" alt="" width="26" height="26"><span>Review</span></a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="bar-tools" id="barTools"></div>
  <button class="icon-btn" id="themeBtn" type="button" title="Switch theme" aria-label="Switch theme">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn" id="helpBtn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
</header>
<main id="app" aria-live="polite"></main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="help" class="help">
  <h2>Keyboard</h2>
  <dl>
    <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Previous / next frame</dd>
    <dt><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd></dt><dd>Ten frames</dd>
    <dt><kbd>Space</kbd></dt><dd>Play / pause</dd>
    <dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>Previous / next comment</dd>
    <dt><kbd>C</kbd></dt><dd>Write a comment on this frame</dd>
    <dt>Drag on the frame</dt><dd>Mark a region</dd>
    <dt><kbd>1</kbd>–<kbd>4</kbd></dt><dd>Single, side by side, wipe, difference</dd>
    <dt><kbd>M</kbd></dt><dd>Sound on / off</dd>
    <dt><kbd>Ctrl</kbd> + <kbd>Enter</kbd></dt><dd>Send</dd>
    <dt><kbd>Esc</kbd></dt><dd>Clear region, leave a field</dd>
  </dl>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<script src="/static/review.js"></script>
</body>
</html>
