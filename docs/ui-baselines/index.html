<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untangle actual Qt interface</title><style>body{margin:0;color:var(--foreground,#202936);font:14px var(--font-sans,system-ui)}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}label{display:grid;gap:5px;font-size:13px;color:var(--muted-foreground,#586373)}select{font:inherit;padding:8px 12px;min-height:38px;border:1px solid var(--border,#aaa);border-radius:6px;background:var(--card,#fff);color:var(--foreground,#202936)}p{line-height:1.5;margin:12px 0;color:var(--muted-foreground,#586373)}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--border,#d5dae1);box-sizing:border-box}figcaption{margin-top:8px;color:var(--muted-foreground,#586373);font-size:13px}button{font:inherit;padding:8px 12px;background:var(--card,#fff);color:var(--foreground,#202936);border:1px solid var(--border,#aaa);border-radius:6px;cursor:pointer}figure.zoom{overflow:auto}figure.zoom img{width:960px;max-width:none}small{font-size:12px}</style><div class="controls"><label>Window<select id="state"><option value="screen">Screen</option><option value="camera">Camera</option><option value="audio-silence">Audio check</option><option value="library-populated">Recordings</option><option value="library-empty">Empty library</option><option value="expanded">Expanded camera</option><option value="advanced">More options</option><option value="recording">Recording</option><option value="paused">Paused</option><option value="saving">Saving</option><option value="error">Recovery</option></select></label><label>Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="zoom" type="button" aria-pressed="false">View at actual size</button></div><figure data-state="screen" data-theme="light" ><img src="./screen-light-960x760.png" alt="Actual Untangle Screen window, light theme, 960 by 760 pixels"><figcaption>Screen · light · 960 × 760</figcaption></figure><figure data-state="screen" data-theme="dark" hidden><img src="./screen-dark-960x760.png" alt="Actual Untangle Screen window, dark theme, 960 by 760 pixels"><figcaption>Screen · dark · 960 × 760</figcaption></figure><figure data-state="camera" data-theme="light" hidden><img src="./camera-light-960x760.png" alt="Actual Untangle Camera window, light theme, 960 by 760 pixels"><figcaption>Camera · light · 960 × 760</figcaption></figure><figure data-state="camera" data-theme="dark" hidden><img src="./camera-dark-960x760.png" alt="Actual Untangle Camera window, dark theme, 960 by 760 pixels"><figcaption>Camera · dark · 960 × 760</figcaption></figure><figure data-state="audio-silence" data-theme="light" hidden><img src="./audio-silence-light-960x760.png" alt="Actual Untangle Audio check window, light theme, 960 by 760 pixels"><figcaption>Audio check · light · 960 × 760</figcaption></figure><figure data-state="audio-silence" data-theme="dark" hidden><img src="./audio-silence-dark-960x760.png" alt="Actual Untangle Audio check window, dark theme, 960 by 760 pixels"><figcaption>Audio check · dark · 960 × 760</figcaption></figure><figure data-state="library-populated" data-theme="light" hidden><img src="./library-populated-light-960x760.png" alt="Actual Untangle Recordings window, light theme, 960 by 760 pixels"><figcaption>Recordings · light · 960 × 760</figcaption></figure><figure data-state="library-populated" data-theme="dark" hidden><img src="./library-populated-dark-960x760.png" alt="Actual Untangle Recordings window, dark theme, 960 by 760 pixels"><figcaption>Recordings · dark · 960 × 760</figcaption></figure><figure data-state="library-empty" data-theme="light" hidden><img src="./library-empty-light-960x760.png" alt="Actual Untangle Empty library window, light theme, 960 by 760 pixels"><figcaption>Empty library · light · 960 × 760</figcaption></figure><figure data-state="library-empty" data-theme="dark" hidden><img src="./library-empty-dark-960x760.png" alt="Actual Untangle Empty library window, dark theme, 960 by 760 pixels"><figcaption>Empty library · dark · 960 × 760</figcaption></figure><figure data-state="expanded" data-theme="light" hidden><img src="./expanded-light-960x760.png" alt="Actual Untangle Expanded camera window, light theme, 960 by 760 pixels"><figcaption>Expanded camera · light · 960 × 760</figcaption></figure><figure data-state="expanded" data-theme="dark" hidden><img src="./expanded-dark-960x760.png" alt="Actual Untangle Expanded camera window, dark theme, 960 by 760 pixels"><figcaption>Expanded camera · dark · 960 × 760</figcaption></figure><figure data-state="advanced" data-theme="light" hidden><img src="./advanced-light-960x760.png" alt="Actual Untangle More options window, light theme, 960 by 760 pixels"><figcaption>More options · light · 960 × 760</figcaption></figure><figure data-state="advanced" data-theme="dark" hidden><img src="./advanced-dark-960x760.png" alt="Actual Untangle More options window, dark theme, 960 by 760 pixels"><figcaption>More options · dark · 960 × 760</figcaption></figure><figure data-state="recording" data-theme="light" hidden><img src="./recording-light-960x760.png" alt="Actual Untangle Recording window, light theme, 960 by 760 pixels"><figcaption>Recording · light · 960 × 760</figcaption></figure><figure data-state="recording" data-theme="dark" hidden><img src="./recording-dark-960x760.png" alt="Actual Untangle Recording window, dark theme, 960 by 760 pixels"><figcaption>Recording · dark · 960 × 760</figcaption></figure><figure data-state="paused" data-theme="light" hidden><img src="./paused-light-960x760.png" alt="Actual Untangle Paused window, light theme, 960 by 760 pixels"><figcaption>Paused · light · 960 × 760</figcaption></figure><figure data-state="paused" data-theme="dark" hidden><img src="./paused-dark-960x760.png" alt="Actual Untangle Paused window, dark theme, 960 by 760 pixels"><figcaption>Paused · dark · 960 × 760</figcaption></figure><figure data-state="saving" data-theme="light" hidden><img src="./saving-light-960x760.png" alt="Actual Untangle Saving window, light theme, 960 by 760 pixels"><figcaption>Saving · light · 960 × 760</figcaption></figure><figure data-state="saving" data-theme="dark" hidden><img src="./saving-dark-960x760.png" alt="Actual Untangle Saving window, dark theme, 960 by 760 pixels"><figcaption>Saving · dark · 960 × 760</figcaption></figure><figure data-state="error" data-theme="light" hidden><img src="./error-light-960x760.png" alt="Actual Untangle Recovery window, light theme, 960 by 760 pixels"><figcaption>Recovery · light · 960 × 760</figcaption></figure><figure data-state="error" data-theme="dark" hidden><img src="./error-dark-960x760.png" alt="Actual Untangle Recovery window, dark theme, 960 by 760 pixels"><figcaption>Recovery · dark · 960 × 760</figcaption></figure><p>These are captures of the production Qt interface, using isolated settings and mocked devices. The marked test pattern replaces the capture feed. Audio and recording states are synthetic. No camera, microphone or audible playback was opened.</p><script>const state=document.getElementById('state'),theme=document.getElementById('theme'),zoom=document.getElementById('zoom');function update(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.state!==state.value||f.dataset.theme!==theme.value)}state.onchange=theme.onchange=update;zoom.onclick=()=>{const on=zoom.getAttribute('aria-pressed')!=='true';zoom.setAttribute('aria-pressed',String(on));zoom.textContent=on?'Fit to conversation':'View at actual size';document.querySelectorAll('figure').forEach(f=>f.classList.toggle('zoom',on))};update()</script></html>
